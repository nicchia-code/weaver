[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/fake-acp", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nicchia-code/weaver"
authors = ["Weaver contributors"]

[workspace.dependencies]
weaver-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
