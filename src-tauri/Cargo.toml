[package]
name = "weaver"
description = "Weaver: the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "weaver"

[lib]
name = "weaver_lib"
crate-type = ["rlib"]

[[bin]]
name = "weaver"
path = "src/main.rs"

[features]
# Serves the embedded UI instead of the dev server; `tauri build` turns it on.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
notify = "8"
# The local time of the computer, which names a request the agent of Chat sends (`requests`).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Starts a native drag of assets out of a window (`assets::drag`); never through `tauri-plugin-drag`.
drag = "2.1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "signal", "sync", "time"] }
weaver-cli = { path = "../crates/cli" }
weaver-core.workspace = true
ts-rs = { version = "11", features = ["serde-compat"] }

# Hiding a fullscreen window waits for AppKit to end the exit transition (`windows::fullscreen`).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
