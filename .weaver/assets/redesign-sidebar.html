<script type="text/x-dc" data-dc-script="" data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;board&quot;,&quot;chat&quot;,&quot;jobs&quot;,&quot;req&quot;,&quot;specs&quot;,&quot;hist&quot;],&quot;default&quot;:&quot;board&quot;},&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:960}}">
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'board';
    var keys = ['board', 'chat', 'jobs', 'req', 'specs', 'hist'];
    var n = {};
    keys.forEach(function (k) {
      var on = k === active;
      n[k] = {
        bg: on ? '#FFFFFF' : 'transparent',
        fg: on ? '#18181B' : '#52525B',
        sh: on ? '0 0 0 1px #E7E5DF, 0 1px 2px rgba(24,24,27,0.06)' : 'none',
        fw: on ? '550' : '400'
      };
    });
    return { n: n };
  }
}
