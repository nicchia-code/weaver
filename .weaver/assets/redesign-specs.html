<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Weaver · Specs</title>
<script src="333e035b-05a5-42f8-859f-607646081425"></script>
</head>
<body>
<x-dc>

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F6F5F1; font-family: Geist, Inter, system-ui, sans-serif; color: #18181B; font-size: 14px">
  <div style="flex: 1 1 248px; max-width: 100%; display: flex">
    <dc-import name="Sidebar" active="specs" hint-size="248px,960px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; margin: 8px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 1px #E7E5DF, 0 1px 3px rgba(24,24,27,0.04); display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 28px; border-bottom: 1px solid #EFEDE7">
      <div style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 260px">
        <h1 style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.015em">Specs</h1>
        <p style="margin: 0; font-size: 13px; color: #6B6B73">The stack the agents build with · <span style="font-family: 'Geist Mono', monospace; font-size: 12px">specs.yaml</span></p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px">
        <button type="button" aria-pressed="true" style="height: 30px; padding: 0 11px; border-radius: 999px; border: 0; background: #18181B; color: #FFFFFF; font: inherit; font-size: 12.5px; cursor: pointer">All 16</button>
        <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #E7E5DF; background: #FFFFFF; color: #52525B; font: inherit; font-size: 12.5px; cursor: pointer"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5l1.3 3.2 3.2 1.3-3.2 1.3L8 11.5 6.7 8.3 3.5 7l3.2-1.3z"></path></svg>Agent's choice 7</button>
        <button type="button" aria-pressed="false" style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #E7E5DF; background: #FFFFFF; color: #52525B; font: inherit; font-size: 12.5px; cursor: pointer">Local only 1</button>
      </div>
    </header>

    <div style="flex: 1; padding: 28px; display: flex; flex-direction: column; gap: 36px; max-width: 1180px; box-sizing: border-box; width: 100%">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section style="display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 10px">
            <h2 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em">{{g.title}}</h2>
            <span style="font-size: 12px; color: #6B6B73">{{g.count}}</span>
            <span style="flex: 1; height: 1px; background: #EFEDE7"></span>
            <a href="#" style="display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; color: #52525B; text-decoration: none; padding: 4px 6px; border-radius: 7px">
              <svg width="13" height="13" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h4v4M13 3L7.5 8.5M11.5 9.5V13H3V4.5h3.5"></path></svg>Edit
            </a>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px">
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
              <article style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E7E5DF, 0 1px 2px rgba(24,24,27,0.03); min-height: 92px; box-sizing: border-box">
                <div style="display: flex; align-items: center; gap: 8px">
                  <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 7px; background: {{it.tint}}; color: {{it.ink}}; display: grid; place-items: center; font-size: 12px; font-weight: 600">{{it.initial}}</span>
                  <h3 style="margin: 0; font-size: 14px; font-weight: 600; flex: 1; min-width: 0">{{it.name}}</h3>
                  <sc-if value="{{it.hasVersion}}" hint-placeholder-val="{{ true }}">
                    <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #52525B; background: #F6F5F1; border-radius: 5px; padding: 1px 6px">{{it.version}}</span>
                  </sc-if>
                </div>
                <sc-if value="{{it.hasDesc}}" hint-placeholder-val="{{ true }}">
                  <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #52525B">{{it.desc}}</p>
                </sc-if>
                <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto">
                  <sc-if value="{{it.agent}}" hint-placeholder-val="{{ false }}">
                    <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: #5B4A99; background: #EFEAF8; border-radius: 999px; padding: 2px 8px"><svg width="11" height="11" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5l1.3 3.2 3.2 1.3-3.2 1.3L8 11.5 6.7 8.3 3.5 7l3.2-1.3z"></path></svg>Agent's choice</span>
                  </sc-if>
                  <sc-if value="{{it.local}}" hint-placeholder-val="{{ false }}">
                    <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: #9A4A22; background: #FBEDE4; border-radius: 999px; padding: 2px 8px">Local only</span>
                  </sc-if>
                </div>
              </article>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    var tints = {
      lav: ['#EFEAF8', '#5B4A99'], sky: ['#E6EFF8', '#2E5F8F'], sage: ['#E9F2E7', '#3F6B3C'],
      peach: ['#FBEDE4', '#9A4A22'], rose: ['#F9E8ED', '#9B3B57']
    };
    function it(name, version, desc, agent, local, t) {
      return {
        name: name, version: version, hasVersion: !!version, desc: desc, hasDesc: !!desc,
        agent: !!agent, local: !!local, initial: name.charAt(0), tint: tints[t][0], ink: tints[t][1]
      };
    }
    var groups = [
      { title: 'Languages', items: [
        it('Python', '3.12', '', false, false, 'sky'),
        it('TypeScript', '5', '', false, false, 'sky')
      ]},
      { title: 'Frameworks', items: [
        it('FastAPI', '', '', false, false, 'sage'),
        it('React', '19', '', false, false, 'sky'),
        it('Vite', '', '', true, false, 'lav'),
        it('SQLAlchemy', '2', '', true, false, 'peach'),
        it('Alembic', '', '', true, false, 'peach'),
        it('Authlib', '', '', true, false, 'rose'),
        it('WeasyPrint', '', '', true, false, 'rose'),
        it('PyMuPDF', '', '', true, false, 'peach'),
        it('Pillow', '', 'with pillow-heif for HEIC and HEIF photos', true, false, 'sage'),
        it('Azure AI Document Intelligence', '', 'prebuilt-layout model; reads text, roles, tables, selection marks and figures', false, false, 'sky'),
        it('Azure OpenAI', '', 'One chat model deployment with structured output; rewrites the text', false, false, 'sky'),
        it('omp', '', 'Alternative simplification service: the omp agent as an ACP server over stdio, run by the worker on the developer’s machine', false, true, 'lav')
      ]},
      { title: 'Data', items: [
        it('PostgreSQL', '16', 'Azure Flexible Server; documents, blocks, sessions, accounts, jobs, daily counters', false, false, 'sky'),
        it('Azure Blob Storage', '', 'Private container for pages and figures', false, false, 'sky')
      ]}
    ];
    groups.forEach(function (g) { g.count = String(g.items.length); });
    return { groups: groups };
  }
}
</script>


</body></html>
